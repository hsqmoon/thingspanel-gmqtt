db:
  redis:
    # redis 连接字符串
    conn: 127.0.0.1:6379
    # redis 数据库号
    db_num: 1
    # redis 密码
    password: "redis"
    # Broker 鉴权缓存连接池上限
    pool_size: 64
  psql:
#    psqladdr: "47.92.253.145"
    psqladdr: "127.0.0.1"
    psqlport: 5432 # 默认5432
    psqldb: ThingsPanel
    psqluser: postgres
    psqlpass: postgresThingsPanel
    max_open_conns: 6
    max_idle_conns: 2

mqtt:
  # 生产必须通过 GMQTT_MQTT_PASSWORD / GMQTT_MQTT_PLUGIN_PASSWORD 覆盖。
  broker: localhost:1883
  password: "environment-required"
  plugin_password: "environment-required"

# 监控面板
# http://127.0.0.1:8082
# http://127.0.0.1:8083 admin admin
